<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>お薬マネージャー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    input[type="time"] {
      -webkit-appearance: none;
      min-height: 42px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 pb-16 font-sans">
  <div class="max-w-md mx-auto space-y-5">

    <!-- ヘッダー -->
    <div class="text-center pt-2">
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">💊 お薬マネージャー</h1>
      <p id="status-text" class="text-xs text-slate-500 mt-0.5">LINE認証中...</p>
    </div>

    <!-- ストリーク ＆ モチベーション応援カード -->
    <div class="bg-gradient-to-br from-indigo-500 to-blue-600 text-white p-5 rounded-2xl shadow-sm">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-medium text-blue-100">継続ストリーク</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span class="text-3xl font-black tracking-tight" id="streak-count">0</span>
            <span class="text-sm font-semibold text-blue-100">日連続！🔥</span>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs font-medium text-blue-100">今月の達成</span>
          <div class="flex items-baseline justify-end gap-1 mt-0.5">
            <span class="text-2xl font-black tracking-tight" id="monthly-count">0</span>
            <span class="text-xs font-semibold text-blue-100">日 💮</span>
          </div>
        </div>
      </div>
      <div class="mt-3.5 pt-3 border-t border-white/15">
        <p id="streak-message" class="text-xs font-medium text-blue-50 flex items-center gap-1.5">
          <span>🌱</span> 読み込み中...
        </p>
      </div>
    </div>

    <!-- カレンダーカード -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <span>🗓️</span> <span id="calendar-title">カレンダー</span>
        </h2>
        <div class="flex items-center gap-1">
          <button onclick="prevMonth()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 text-xs font-bold transition">◀</button>
          <button onclick="nextMonth()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 text-xs font-bold transition">▶</button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-2">
        <span class="text-red-400">日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span class="text-blue-400">土</span>
      </div>

      <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>

      <div id="selected-day-card" class="mt-4 pt-3.5 border-t border-slate-100 hidden">
        <div class="flex items-center justify-between mb-2.5">
          <h3 id="selected-day-title" class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span>📌</span> <span>記録</span>
          </h3>
          <span id="selected-day-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full"></span>
        </div>

        <div id="selected-day-list" class="space-y-1.5"></div>

        <div class="mt-3 pt-2.5 border-t border-slate-100">
          <button type="button" id="open-manual-btn" onclick="toggleManualForm(true)"
            class="w-full py-2 px-3 text-xs font-semibold text-blue-600 bg-blue-50/70 hover:bg-blue-100/70 rounded-xl transition flex items-center justify-center gap-1.5">
            <span>➕</span> <span>この日の記録をつける</span>
          </button>

          <div id="manual-form-container" class="hidden mt-2 p-3 bg-slate-50 rounded-xl space-y-2.5 border border-slate-100">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">飲んだお薬</label>
              <select id="manual-med-select" class="w-full px-2.5 py-2 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">飲んだ時間</label>
              <input type="time" id="manual-time" value="08:00" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2 pt-1">
              <button type="button" onclick="submitManualIntake()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition shadow-sm">
                記録を保存
              </button>
              <button type="button" onclick="toggleManualForm(false)" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 font-semibold text-xs rounded-lg transition">
                閉じる
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- お薬フォームカード -->
    <div id="form-card" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 id="form-title" class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-1.5">
        <span>➕</span> <span>新しいお薬を登録</span>
      </h2>
      <form id="med-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">お薬の名前</label>
          <input type="text

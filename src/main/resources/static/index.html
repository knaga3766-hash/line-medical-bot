<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>お薬マネージャー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    input[type="time"] {
      -webkit-appearance: none;
      min-height: 42px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 pb-16 font-sans">
  <div class="max-w-md mx-auto space-y-5">

    <!-- ヘッダー -->
    <div class="text-center pt-2">
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">💊 お薬マネージャー</h1>
      <p id="status-text" class="text-xs text-slate-500 mt-0.5">LINE認証中...</p>
    </div>

    <!-- ストリーク ＆ モチベーション応援カード -->
    <div class="bg-gradient-to-br from-indigo-500 to-blue-600 text-white p-5 rounded-2xl shadow-sm">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-medium text-blue-100">継続ストリーク</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span class="text-3xl font-black tracking-tight" id="streak-count">0</span>
            <span class="text-sm font-semibold text-blue-100">日連続！🔥</span>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs font-medium text-blue-100">今月の達成</span>
          <div class="flex items-baseline justify-end gap-1 mt-0.5">
            <span class="text-2xl font-black tracking-tight" id="monthly-count">0</span>
            <span class="text-xs font-semibold text-blue-100">日 💮</span>
          </div>
        </div>
      </div>
      <div class="mt-3.5 pt-3 border-t border-white/15">
        <p id="streak-message" class="text-xs font-medium text-blue-50 flex items-center gap-1.5">
          <span>🌱</span> 読み込み中...
        </p>
      </div>
    </div>

    <!-- カレンダーカード -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <span>🗓️</span> <span id="calendar-title">カレンダー</span>
        </h2>
        <div class="flex items-center gap-1">
          <button onclick="prevMonth()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 text-xs font-bold transition">◀</button>
          <button onclick="nextMonth()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 text-xs font-bold transition">▶</button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-2">
        <span class="text-red-400">日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span class="text-blue-400">土</span>
      </div>

      <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>

      <!-- 選択した日の詳細カード -->
      <div id="selected-day-card" class="mt-4 pt-3.5 border-t border-slate-100 hidden">
        <div class="flex items-center justify-between mb-2.5">
          <h3 id="selected-day-title" class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span>📌</span> <span>記録</span>
          </h3>
          <span id="selected-day-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full"></span>
        </div>

        <div id="selected-day-list" class="space-y-1.5"></div>

        <div class="mt-3 pt-2.5 border-t border-slate-100">
          <button type="button" id="open-manual-btn" onclick="toggleManualForm(true)"
            class="w-full py-2 px-3 text-xs font-semibold text-blue-600 bg-blue-50/70 hover:bg-blue-100/70 rounded-xl transition flex items-center justify-center gap-1.5">
            <span>➕</span> <span>この日の記録をつける</span>
          </button>

          <div id="manual-form-container" class="hidden mt-2 p-3 bg-slate-50 rounded-xl space-y-2.5 border border-slate-100">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">飲んだお薬</label>
              <select id="manual-med-select" class="w-full px-2.5 py-2 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">飲んだ時間</label>
              <input type="time" id="manual-time" value="08:00" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2 pt-1">
              <button type="button" onclick="submitManualIntake()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition shadow-sm">
                記録を保存
              </button>
              <button type="button" onclick="toggleManualForm(false)" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 font-semibold text-xs rounded-lg transition">
                閉じる
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- お薬登録フォームカード -->
    <div id="form-card" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 id="form-title" class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-1.5">
        <span>➕</span> <span>新しいお薬を登録</span>
      </h2>
      <form id="med-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">お薬の名前</label>
          <input type="text" id="med-name" required placeholder="例: ロキソニン"
            class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">通知時間</label>
          <input type="time" id="med-time" required value="08:00"
            class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
        </div>
        <button type="submit"
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition shadow-sm shadow-blue-200">
          登録する
        </button>
      </form>
    </div>

  </div>

  <script>
    let currentUserId = null;
    let currentDate = new Date();
    let selectedDateStr = null;
    let userMedicines = [];
    let monthlyLogs = {};

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      loadMonthlyData();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      loadMonthlyData();
    }

    function toggleManualForm(show) {
      const container = document.getElementById('manual-form-container');
      const btn = document.getElementById('open-manual-btn');
      if (show) {
        container.classList.remove('hidden');
        btn.classList.add('hidden');
      } else {
        container.classList.add('hidden');
        btn.classList.remove('hidden');
      }
    }

    async function initLiff() {
      try {
        await liff.init({ liffId: "2011761175-lcQ9D2JG" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
          document.getElementById('status-text').textContent = `ログイン中: ${profile.displayName}`;
        } else {
          currentUserId = "test_user_debug";
          document.getElementById('status-text').textContent = 'テストモード';
        }
      } catch (err) {
        console.error('LIFF Initialization failed', err);
        document.getElementById('status-text').textContent = 'テストモード(認証エラー)';
        currentUserId = "test_user_debug";
      }
      await loadUserData();
    }

    async function loadUserData() {
      if (!currentUserId) return;
      try {
        // お薬一覧とストリーク情報の取得
        const [medRes, streakRes] = await Promise.all([
          fetch(`/api/medicines?userId=${currentUserId}`),
          fetch(`/api/streak?userId=${currentUserId}`)
        ]);
        
        if (medRes.ok) {
          userMedicines = await medRes.json();
          updateMedSelect();
        }
        if (streakRes.ok) {
          const streakData = await streakRes.json();
          document.getElementById('streak-count').textContent = streakData.streak || 0;
          document.getElementById('monthly-count').textContent = streakData.monthlyCount || 0;
          document.getElementById('streak-message').innerHTML = `<span>🌱</span> ${streakData.message || '今日も自分のペースでいこう！'}`;
        }
      } catch (e) {
        console.error("Data load error", e);
      }
      loadMonthlyData();
    }

    async function loadMonthlyData() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      document.getElementById('calendar-title').textContent = `${year}年 ${month}月`;

      try {
        const res = await fetch(`/api/logs/month?userId=${currentUserId}&year=${year}&month=${month}`);
        if (res.ok) {
          monthlyLogs = await res.json();
        }
      } catch (e) {
        console.error("Monthly logs error", e);
        monthlyLogs = {};
      }
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        grid.appendChild(empty);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= lastDay; day++) {
        const cell = document.createElement('div');
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateStr = `${year}-${mStr}-${dStr}`;

        cell.className = 'aspect-square flex flex-col items-center justify-center text-xs font-medium rounded-lg bg-slate-50 hover:bg-blue-50 cursor-pointer transition relative';
        
        const isLogged = monthlyLogs[dateStr];
        let bgClass = 'bg-slate-50 text-slate-700';
        if (dateStr === todayStr) {
          bgClass = 'border-2 border-blue-500 font-bold text-blue-600';
        }
        if (isLogged) {
          bgClass = 'bg-emerald-500 text-white font-bold';
        }
        cell.className += ` ${bgClass}`;

        cell.innerHTML = `<span>${day}</span>`;
        if (isLogged) {
          cell.innerHTML += `<span class="text-[9px] mt-0.5">💮</span>`;
        }

        cell.onclick = () => selectDate(dateStr);
        grid.appendChild(cell);
      }
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      const card = document.getElementById('selected-day-card');
      card.classList.remove('hidden');
      document.getElementById('selected-day-title').innerHTML = `<span>📌</span> <span>${dateStr} の記録</span>`;
      
      const list = document.getElementById('selected-day-list');
      const logs = monthlyLogs[dateStr] || [];
      
      if (logs.length > 0) {
        list.innerHTML = logs.map(l => `
          <div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg text-xs">
            <span class="font-semibold text-slate-700">${l.medicineName}</span>
            <span class="text-slate-500">${l.takenTime} 飲用済 ✅</span>
          </div>
        `).join('');
        document.getElementById('selected-day-badge').textContent = '達成済み';
        document.getElementById('selected-day-badge').className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
      } else {
        list.innerHTML = `<p class="text-xs text-slate-400 py-1">この日の記録はありません</p>`;
        document.getElementById('selected-day-badge').textContent = '未記録';
        document.getElementById('selected-day-badge').className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500';
      }
      toggleManualForm(false);
    }

    function updateMedSelect() {
      const select = document.getElementById('manual-med-select');
      select.innerHTML = userMedicines.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    }

    // お薬新規登録
    document.getElementById('med-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('med-name').value;
      const time = document.getElementById('med-time').value;

      try {
        const res = await fetch('/api/medicines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, name: name, notificationTime: time })
        });
        if (res.ok) {
          alert('お薬を登録しました！');
          document.getElementById('med-name').value = '';
          loadUserData();
        } else {
          alert('登録に失敗しました');
        }
      } catch (err) {
        console.error(err);
        alert('通信エラーが発生しました');
      }
    });

    // 手動記録保存
    async function submitManualIntake() {
      const medId = document.getElementById('manual-med-select').value;
      const time = document.getElementById('manual-time').value;
      if (!medId || !selectedDateStr) return;

      try {
        const res = await fetch('/api/intake/manual', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, medicineId: medId, date: selectedDateStr, takenTime: time })
        });
        if (res.ok) {
          alert('記録を保存しました！');
          toggleManualForm(false);
          loadMonthlyData();
          loadUserData();
        } else {
          alert('保存に失敗しました');
        }
      } catch (err) {
        console.error(err);
        alert('通信エラーが発生しました');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initLiff();
    });
  </script>
</body>
</html>
